[project]
name = "dokuma"
dynamic = ["version"]
description = "Extract structured content (text, tables, headings, images) from PDF, DOCX, XLSX, XLS, HTML, Markdown, CSV, and email into one unified schema."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Engincan Varan" },
    { name = "Claude", email = "noreply@anthropic.com" },
]
keywords = ["document-parsing", "pdf", "docx", "xlsx", "rag", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pdf = [
    "pdf-inspector>=0.2.6",
    "pdfplumber>=0.11",
]
docx = ["python-docx>=1.1"]
xlsx = [
    "openpyxl>=3.1",
    "xlrd>=2.0",  # legacy .xls only - xlrd 2.0 dropped .xlsx support
]
xlsb = ["pyxlsb>=1.0.10"]  # Excel Binary Workbook - distinct from both xlsx and legacy xls
# msg is a much heavier extra than every other one here - extract-msg
# pulls in ~15 transitive dependencies (oletools, msoffcrypto-tool,
# even a Tkinter GUI library it doesn't need for headless use). It's the
# only mature pure-Python .msg reader; no lighter option exists. A
# deliberate, documented tradeoff - not an oversight.
msg = ["extract-msg>=0.56.1"]
# html/markdown/csv/email need no extra - stdlib only.
pandas = ["pandas>=2.0"]  # only for ExtractionResult.tables_as_dataframes() / table_to_dataframe()
all = ["dokuma[pdf,docx,xlsx,xlsb,msg]"]

[project.urls]
Homepage = "https://github.com/engincanvaran/dokuma"
Repository = "https://github.com/engincanvaran/dokuma"
Issues = "https://github.com/engincanvaran/dokuma/issues"
Changelog = "https://github.com/engincanvaran/dokuma/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "fpdf2>=2.7",
    "xlwt>=1.3",  # legacy .xls writer, for test fixtures only - xlrd only reads
    "pandas-stubs>=2.0",  # real type stubs for pandas, better than ignore_missing_imports
    "pillow>=11.0",  # test fixtures embed real pictures directly, not just via pdfplumber's transitive dep
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # use pathlib over os.path
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "ARG", # unused arguments
    "T20", # no print() - use logging in library code
    "ERA", # no commented-out code
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T20"]  # print() is the whole point of a demo script

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlrd.*", "xlwt.*", "pyxlsb.*", "extract_msg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dokuma --cov-report=term-missing"

[tool.coverage.run]
source = ["dokuma"]
branch = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["dokuma"]
